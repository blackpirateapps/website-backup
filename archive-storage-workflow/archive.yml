name: Manual Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://www.blackpiratex.com/
      ARCHIVE_VIEWER_BASE_URL: ${{ vars.ARCHIVE_VIEWER_BASE_URL }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate Timestamp
        run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Validate Viewer Base URL
        run: |
          if [ -z "$ARCHIVE_VIEWER_BASE_URL" ]; then
            echo "ARCHIVE_VIEWER_BASE_URL repo variable is required"
            exit 1
          fi

      - name: Create Working Directories
        run: |
          mkdir -p tmp/${{ env.TIMESTAMP }}/site
          mkdir -p snapshots/${{ env.TIMESTAMP }}
          mkdir -p objects

      - name: Take Screenshot
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.goto(process.env.TARGET_URL, { waitUntil: 'networkidle0', timeout: 60000 });
            await page.screenshot({ path: 'tmp/${{ env.TIMESTAMP }}/screenshot.png', fullPage: true });
            await browser.close();
          })();
          "

      - name: Download Site with wget
        run: |
          wget --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --timeout=30 \
            --tries=3 \
            -P tmp/${{ env.TIMESTAMP }}/site \
            ${{ env.TARGET_URL }} || true

      - name: Build CAS Snapshot and Metadata
        run: |
          node <<'EOF'
          const fs = require('fs');
          const fsp = fs.promises;
          const path = require('path');
          const crypto = require('crypto');

          const timestamp = process.env.TIMESTAMP;
          const targetUrl = process.env.TARGET_URL;
          const viewerBaseUrl = process.env.ARCHIVE_VIEWER_BASE_URL;
          const downloadRoot = path.join('tmp', timestamp, 'site');
          const screenshotPath = path.join('tmp', timestamp, 'screenshot.png');
          const snapshotDir = path.join('snapshots', timestamp);
          const objectsDir = 'objects';

          const mimeMap = {
            '.html': 'text/html; charset=utf-8',
            '.htm': 'text/html; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.js': 'application/javascript; charset=utf-8',
            '.mjs': 'application/javascript; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.txt': 'text/plain; charset=utf-8',
            '.xml': 'application/xml; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.gif': 'image/gif',
            '.webp': 'image/webp',
            '.ico': 'image/x-icon',
            '.woff': 'font/woff',
            '.woff2': 'font/woff2',
            '.ttf': 'font/ttf',
            '.eot': 'application/vnd.ms-fontobject',
            '.mp4': 'video/mp4',
            '.webm': 'video/webm',
            '.mp3': 'audio/mpeg',
            '.wav': 'audio/wav',
            '.pdf': 'application/pdf'
          };

          async function walk(dir) {
            const entries = await fsp.readdir(dir, { withFileTypes: true });
            let files = [];
            for (const entry of entries) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                files = files.concat(await walk(full));
              } else if (entry.isFile()) {
                files.push(full);
              }
            }
            return files;
          }

          function extToMime(relPath) {
            const ext = path.extname(relPath).toLowerCase();
            return mimeMap[ext] || undefined;
          }

          function posixRelative(from, to) {
            return path.relative(from, to).split(path.sep).join('/');
          }

          async function exists(filePath) {
            try {
              await fsp.access(filePath);
              return true;
            } catch {
              return false;
            }
          }

          const downloadedFiles = (await exists(downloadRoot)) ? await walk(downloadRoot) : [];

          const manifest = {
            version: 'cas-v1',
            source_url: targetUrl,
            created_at: new Date().toISOString(),
            root: null,
            files: {}
          };

          let fileCount = 0;
          let sourceBytes = 0;
          let newObjectCount = 0;
          let newObjectBytes = 0;

          for (const file of downloadedFiles) {
            const relPath = posixRelative(downloadRoot, file);
            const bytes = await fsp.readFile(file);
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            const objectDir = path.join(objectsDir, hash.slice(0, 2));
            const objectPath = path.join(objectDir, hash);

            if (!(await exists(objectPath))) {
              await fsp.mkdir(objectDir, { recursive: true });
              await fsp.writeFile(objectPath, bytes);
              newObjectCount += 1;
              newObjectBytes += bytes.length;
            }

            manifest.files[relPath] = {
              hash,
              size: bytes.length,
              content_type: extToMime(relPath)
            };

            fileCount += 1;
            sourceBytes += bytes.length;

            if (!manifest.root && relPath.endsWith('/index.html')) {
              manifest.root = relPath;
            }
          }

          if (!manifest.root && manifest.files['index.html']) {
            manifest.root = 'index.html';
          }

          await fsp.mkdir(snapshotDir, { recursive: true });
          await fsp.writeFile(
            path.join(snapshotDir, 'manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`
          );

          if (await exists(screenshotPath)) {
            await fsp.copyFile(screenshotPath, path.join(snapshotDir, 'screenshot.png'));
          }

          const metadata = {
            format: 'cas-v1',
            url: targetUrl,
            snapshot_date: new Date().toISOString(),
            file_count: fileCount,
            source_size_bytes: sourceBytes,
            source_size_mb: Number((sourceBytes / 1048576).toFixed(2)),
            new_object_count: newObjectCount,
            new_object_bytes: newObjectBytes,
            new_object_mb: Number((newObjectBytes / 1048576).toFixed(2)),
            timestamp
          };

          await fsp.writeFile(
            path.join(snapshotDir, 'metadata.json'),
            `${JSON.stringify(metadata, null, 2)}\n`
          );

          const output = {
            file_count: fileCount,
            source_size_mb: Number((sourceBytes / 1048576).toFixed(2)),
            viewer_url: `${viewerBaseUrl.replace(/\/$/, '')}/archive/${timestamp}/index.html`
          };

          await fsp.writeFile('tmp/index-update.json', `${JSON.stringify(output)}\n`);
          EOF

      - name: Update index.json
        run: |
          if [ ! -f index.json ]; then echo '{"archives":[]}' > index.json; fi

          VIEWER_URL=$(jq -r '.viewer_url' tmp/index-update.json)
          SIZE_MB=$(jq -r '.source_size_mb' tmp/index-update.json)

          jq --arg id "${{ env.TIMESTAMP }}" \
             --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
             --arg screenshot "https://blackpirateapps.github.io/archive-storage/snapshots/${{ env.TIMESTAMP }}/screenshot.png" \
             --arg url "$VIEWER_URL" \
             --arg format "cas-v1" \
             --argjson size_mb "$SIZE_MB" \
             '.archives = [{"id": $id, "date": $date, "screenshot": $screenshot, "url": $url, "format": $format, "size_mb": $size_mb}] + .archives' \
             index.json > index.tmp && mv index.tmp index.json

      - name: Clean up build artifacts
        run: |
          rm -rf node_modules package.json package-lock.json tmp

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add index.json objects snapshots
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
            exit 0
          fi
          git commit -m "Archive snapshot ${{ env.TIMESTAMP }}"
          git push
